<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ResumeAI — AI Resume Analyzer{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Upload your resume and get honest, specific, AI-powered feedback to improve it.{% endblock %}">

    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwindcss.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                            950: '#1e1b4b',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <!-- App CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

    {% block head_extra %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-gray-50 text-gray-900 font-sans antialiased">

    {% include 'components/navbar.html' %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    {% include 'components/footer.html' %}

    {% block scripts %}{% endblock %}
</body>
</html>
